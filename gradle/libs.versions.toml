# ============================================================================
# Java Starter Kit - Version Catalog
# Centralized dependency and plugin version management
# ============================================================================

[versions]
# Java
java-language = "25"

# Kotlin (for Gradle DSL and build-logic)
kotlin = "2.4.10"

# Testing
assertj = "3.27.3"
mockito = "5.16.1"

# Logging
logback = "1.5.18"
slf4j = "2.0.17"

# JSON
jackson = "2.18.3"

# Web / Server
spring-boot = "4.0.7"
spring-dependency-management = "1.1.7"

# Code Formatting
spotless = "8.8.0"

[libraries]
# Testing
junit-jupiter-api = { module = "org.junit.jupiter:junit-jupiter-api" }
junit-jupiter-engine = { module = "org.junit.jupiter:junit-jupiter-engine" }
junit-jupiter-params = { module = "org.junit.jupiter:junit-jupiter-params" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }
mockito-core = { module = "org.mockito:mockito-core", version.ref = "mockito" }
mockito-junit-jupiter = { module = "org.mockito:mockito-junit-jupiter", version.ref = "mockito" }

# Logging
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }

# JSON
jackson-core = { module = "com.fasterxml.jackson.core:jackson-core", version.ref = "jackson" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }

# Spring Boot Starters - versions managed by spring-boot BOM
spring-boot-starter = { module = "org.springframework.boot:spring-boot-starter" }
spring-boot-starter-web = { module = "org.springframework.boot:spring-boot-starter-web" }
spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
spring-boot-configuration-processor = { module = "org.springframework.boot:spring-boot-configuration-processor" }
spring-boot-devtools = { module = "org.springframework.boot:spring-boot-devtools" }
spring-boot-autoconfigure = { module = "org.springframework.boot:spring-boot-autoconfigure" }

# Kotlin stdlib (for Gradle DSL compatibility)
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlin" }

[plugins]
# Spring
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "spring-dependency-management" }

# Code Formatting
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }