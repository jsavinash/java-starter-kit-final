# ============================================================================
# Java Starter Kit - Version Catalog
# Centralized dependency and plugin version management
# ============================================================================

[versions]
# Java
java-language = "25"

# Kotlin (for Gradle DSL and build-logic)
kotlin = "2.4.10"

# Testing
assertj = "3.27.3"
mockito = "5.16.1"

# Logging
logback = "1.5.18"
slf4j = "2.0.17"

# JSON
jackson = "2.18.3"

# Web / Server
spring-boot = "4.0.7"
spring-dependency-management = "1.1.7"

# Code Formatting
spotless = "8.8.0"

# ──────────────────────────────────────────────────────────────────────────────
# Core Build & Packaging Plugins
# ──────────────────────────────────────────────────────────────────────────────

# Google Jib - Build optimized Docker/OCI images without Docker daemon
jib = "3.4.5"

# Git Commit ID Plugin - Exposes git metadata in build
git-properties = "4.0.1"

# ──────────────────────────────────────────────────────────────────────────────
# Code Generation & Architecture Plugins
# ──────────────────────────────────────────────────────────────────────────────

# Lombok - Boilerplate code reduction
lombok = "1.18.38"

# MapStruct - Object mapping code generation
mapstruct = "1.6.3"

# OpenAPI Generator - API-first code generation from OpenAPI specs
openapi-generator = "7.12.0"

# SpringDoc OpenAPI - Code-first OpenAPI spec generation
springdoc = "2.8.6"

# Flyway - Database migration tool
flyway = "11.6.0"

# ──────────────────────────────────────────────────────────────────────────────
# Code Quality, Security & Testing Plugins
# ──────────────────────────────────────────────────────────────────────────────

# Checkstyle - Code style enforcement (tool version)
checkstyle = "10.23.0"

# SpotBugs - Bytecode static analysis
spotbugs = "4.10.3"
spotbugs-gradle-plugin = "6.5.9"

# OWASP Dependency Check - Security vulnerability scanning
owasp-dependency-check = "12.2.2"

# JaCoCo - Code coverage
jacoco = "0.8.12"

# SonarQube - Code quality dashboard integration
sonarqube = "7.3.1.8318"

[libraries]
# Testing
junit-jupiter-api = { module = "org.junit.jupiter:junit-jupiter-api" }
junit-jupiter-engine = { module = "org.junit.jupiter:junit-jupiter-engine" }
junit-jupiter-params = { module = "org.junit.jupiter:junit-jupiter-params" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }
mockito-core = { module = "org.mockito:mockito-core", version.ref = "mockito" }
mockito-junit-jupiter = { module = "org.mockito:mockito-junit-jupiter", version.ref = "mockito" }

# Logging
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }

# JSON
jackson-core = { module = "com.fasterxml.jackson.core:jackson-core", version.ref = "jackson" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }

# Spring Boot Starters - versions managed by spring-boot BOM
spring-boot-starter = { module = "org.springframework.boot:spring-boot-starter" }
spring-boot-starter-web = { module = "org.springframework.boot:spring-boot-starter-web" }
spring-boot-starter-webflux = { module = "org.springframework.boot:spring-boot-starter-webflux" }
spring-boot-starter-data-jpa = { module = "org.springframework.boot:spring-boot-starter-data-jpa" }
spring-boot-starter-data-mongodb = { module = "org.springframework.boot:spring-boot-starter-data-mongodb" }
spring-boot-starter-data-mongodb-reactive = { module = "org.springframework.boot:spring-boot-starter-data-mongodb-reactive" }
spring-boot-starter-data-redis = { module = "org.springframework.boot:spring-boot-starter-data-redis" }
spring-boot-starter-data-elasticsearch = { module = "org.springframework.boot:spring-boot-starter-data-elasticsearch" }
spring-boot-starter-data-cassandra = { module = "org.springframework.boot:spring-boot-starter-data-cassandra" }
spring-boot-starter-data-couchbase = { module = "org.springframework.boot:spring-boot-starter-data-couchbase" }
spring-boot-starter-data-neo4j = { module = "org.springframework.boot:spring-boot-starter-data-neo4j" }
spring-boot-starter-data-jdbc = { module = "org.springframework.boot:spring-boot-starter-data-jdbc" }
spring-boot-starter-batch = { module = "org.springframework.boot:spring-boot-starter-batch" }
spring-boot-starter-integration = { module = "org.springframework.boot:spring-boot-starter-integration" }
spring-boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }
spring-boot-starter-security = { module = "org.springframework.boot:spring-boot-starter-security" }
spring-boot-starter-thymeleaf = { module = "org.springframework.boot:spring-boot-starter-thymeleaf" }
spring-boot-starter-jdbc = { module = "org.springframework.boot:spring-boot-starter-jdbc" }
spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
spring-boot-configuration-processor = { module = "org.springframework.boot:spring-boot-configuration-processor" }
spring-boot-devtools = { module = "org.springframework.boot:spring-boot-devtools" }
spring-boot-autoconfigure = { module = "org.springframework.boot:spring-boot-autoconfigure" }

# Spring Cloud starters
spring-cloud-starter-bus-amqp = { module = "org.springframework.cloud:spring-cloud-starter-bus-amqp" }
spring-cloud-starter-netflix-eureka-client = { module = "org.springframework.cloud:spring-cloud-starter-netflix-eureka-client" }
spring-cloud-starter-netflix-eureka-server = { module = "org.springframework.cloud:spring-cloud-starter-netflix-eureka-server" }
spring-cloud-starter-gateway = { module = "org.springframework.cloud:spring-cloud-starter-gateway" }
spring-cloud-starter-openfeign = { module = "org.springframework.cloud:spring-cloud-starter-openfeign" }
spring-cloud-starter-sleuth = { module = "org.springframework.cloud:spring-cloud-starter-sleuth" }
spring-cloud-starter-task = { module = "org.springframework.cloud:spring-cloud-starter-task" }
spring-cloud-starter-consul-discovery = { module = "org.springframework.cloud:spring-cloud-starter-consul-discovery" }
spring-cloud-starter-zookeeper-discovery = { module = "org.springframework.cloud:spring-cloud-starter-zookeeper-discovery" }
spring-cloud-starter-netflix-hystrix = { module = "org.springframework.cloud:spring-cloud-starter-netflix-hystrix" }
spring-cloud-starter-netflix-ribbon = { module = "org.springframework.cloud:spring-cloud-starter-netflix-ribbon" }

# Spring Cloud Config
spring-cloud-config-server = { module = "org.springframework.cloud:spring-cloud-config-server" }

# Spring Integration
spring-integration-core = { module = "org.springframework.integration:spring-integration-core" }

# Spring Batch Extensions
spring-batch-extensions = { module = "org.springframework.batch:spring-batch-core" }

# Spring Integration Flow
spring-integration-flow = { module = "org.springframework.integration:spring-integration-core" }

# Databases
h2 = { module = "com.h2database:h2" }

# Kotlin stdlib (for Gradle DSL compatibility)
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlin" }

# Code Generation
lombok = { module = "org.projectlombok:lombok", version.ref = "lombok" }
mapstruct = { module = "org.mapstruct:mapstruct", version.ref = "mapstruct" }
mapstruct-processor = { module = "org.mapstruct:mapstruct-processor", version.ref = "mapstruct" }

# SpringDoc OpenAPI
springdoc-openapi = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "springdoc" }

# Database Migration
flyway-core = { module = "org.flywaydb:flyway-core", version.ref = "flyway" }

# Code Quality
checkstyle = { module = "com.puppycrawl.tools:checkstyle", version.ref = "checkstyle" }
spotbugs-annotations = { module = "com.github.spotbugs:spotbugs-annotations", version.ref = "spotbugs" }

[plugins]
# Spring
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "spring-dependency-management" }

# Code Formatting
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }

# ──────────────────────────────────────────────────────────────────────────────
# Core Build & Packaging Plugins
# ──────────────────────────────────────────────────────────────────────────────

# Google Jib - Containerize applications without Docker daemon
jib = { id = "com.google.cloud.tools.jib", version.ref = "jib" }

# Git Commit ID - Expose git properties in build artifacts
git-properties = { id = "com.gorylenko.gradle-git-properties", version.ref = "git-properties" }

# ──────────────────────────────────────────────────────────────────────────────
# Code Quality, Security & Testing Plugins
# ──────────────────────────────────────────────────────────────────────────────

# Checkstyle - Code style enforcement
checkstyle = { id = "checkstyle" }

# SpotBugs - Find bugs via static analysis
spotbugs = { id = "com.github.spotbugs", version.ref = "spotbugs-gradle-plugin" }

# OWASP Dependency Check - Security vulnerability scanning
owasp-dependency-check = { id = "org.owasp.dependencycheck", version.ref = "owasp-dependency-check" }

# JaCoCo - Code coverage analysis
jacoco = { id = "jacoco" }

# SonarQube - Centralized code quality dashboard
sonarqube = { id = "org.sonarqube", version.ref = "sonarqube" }