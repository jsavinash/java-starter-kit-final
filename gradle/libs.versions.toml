# ============================================================================
# Java Starter Kit - Version Catalog
# Centralized dependency and plugin version management
# ============================================================================

[versions]
# Java
java-language = "25"

# Kotlin (for Gradle DSL and build-logic)
kotlin = "2.4.10"

# Testing
junit-jupiter = "5.11.4"
assertj = "3.27.3"
mockito = "5.16.1"
junit-platform-launcher = "1.11.4"

# Logging
logback = "1.5.18"
slf4j = "2.0.17"

# JSON
jackson = "2.18.3"

# CLI
picocli = "4.7.7"

# Web / Server
spring-boot = "3.4.4"
spring-dependency-management = "1.1.7"
micronaut = "4.7.6"

# HTTP Client
okhttp = "4.12.0"
retrofit = "2.11.0"

# Serverless
aws-lambda = "1.2.3"
aws-lambda-events = "3.15.0"

# Docker
docker-java = "3.4.1"

# Gradle Plugin
gradle-plugin-development = "1.0.0"
gradle-test-kit = "9.6.1"

# Use Latest Versions
ben-manes-versions = "0.53.0"

# Code Formatting
spotless = "8.8.0"

# Shadow (fat JAR)
shadow = "8.1.1"

# Docker Build
docker-remote-api = "9.3.4"

[libraries]
# Testing
junit-jupiter-api = { module = "org.junit.jupiter:junit-jupiter-api", version.ref = "junit-jupiter" }
junit-jupiter-engine = { module = "org.junit.jupiter:junit-jupiter-engine", version.ref = "junit-jupiter" }
junit-jupiter-params = { module = "org.junit.jupiter:junit-jupiter-params", version.ref = "junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junit-platform-launcher" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }
mockito-core = { module = "org.mockito:mockito-core", version.ref = "mockito" }
mockito-junit-jupiter = { module = "org.mockito:mockito-junit-jupiter", version.ref = "mockito" }

# Logging
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }

# JSON
jackson-core = { module = "com.fasterxml.jackson.core:jackson-core", version.ref = "jackson" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }

# CLI
picocli = { module = "info.picocli:picocli", version.ref = "picocli" }

# HTTP
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }

# Serverless
aws-lambda-core = { module = "com.amazonaws:aws-lambda-java-core", version.ref = "aws-lambda" }
aws-lambda-events = { module = "com.amazonaws:aws-lambda-java-events", version.ref = "aws-lambda-events" }

# Docker
docker-java = { module = "com.github.docker-java:docker-java", version.ref = "docker-java" }
docker-java-transport-okhttp = { module = "com.github.docker-java:docker-java-transport-okhttp", version.ref = "docker-java" }

# Kotlin stdlib (for Gradle DSL compatibility)
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlin" }

[plugins]
# Kotlin
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }

# Spring
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "spring-dependency-management" }

# Micronaut
micronaut-application = { id = "io.micronaut.application", version.ref = "micronaut" }
micronaut-library = { id = "io.micronaut.library", version.ref = "micronaut" }

# Use Latest Versions
ben-manes-versions = { id = "com.github.ben-manes.versions", version.ref = "ben-manes-versions" }

# Code Formatting
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }

# Shadow (fat JAR)
shadow = { id = "com.github.johnrengelman.shadow", version.ref = "shadow" }

# Docker
docker-plugin = { id = "com.bmuschko.docker-remote-api", version.ref = "docker-remote-api" }