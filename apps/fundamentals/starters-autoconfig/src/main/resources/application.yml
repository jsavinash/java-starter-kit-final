# ============================================================================
# Spring Boot Starters & Auto-configuration Example
# ============================================================================

server:
  port: 8090

spring:
  application:
    name: starters-autoconfig
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console

management:
  endpoints:
    web:
      exposure:
        include: health,info,beans,env
  endpoint:
    health:
      show-details: always

app:
  datasource:
    url: jdbc:h2:mem:customdb
    driver-class-name: org.h2.Driver