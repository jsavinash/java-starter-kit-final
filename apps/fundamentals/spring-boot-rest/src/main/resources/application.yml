# ============================================================================
# Spring Boot REST APIs Example Configuration
# ============================================================================

server:
  port: 8130

spring:
  application:
    name: spring-boot-rest
  datasource:
    url: jdbc:h2:mem:restdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always